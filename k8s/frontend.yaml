apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskboard-frontend
  namespace: taskboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: taskboard-frontend
  template:
    metadata:
      labels:
        app: taskboard-frontend
    spec:
      containers:
      - name: frontend
        image: taskboard-frontend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: taskboard-frontend
  namespace: taskboard
spec:
  type: NodePort
  selector:
    app: taskboard-frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080